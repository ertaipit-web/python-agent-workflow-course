[project]
site_name = "Мультиагентная разработка на Python"
site_description = "Продвинутый практикум по мультиагентной разработке на Python"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["stylesheets/course.css"]
nav = [
  "index.md",
  "course/index.md",
  "autonomous-agents.md",
  "lab-repository.md",
  "repo-triage.md",
  "rag-lab.md",
  "integration-lab.md",
  "local-models.md",
  "ollama-vscode.md",
  "sources.md",
]

[project.markdown_extensions]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid" },
]

[project.theme]
[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Включить тёмную тему"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Включить светлую тему"