[project]
site_name = "Мультиагентная разработка на Python"
site_description = "Продвинутый практикум по мультиагентной разработке на Python"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["stylesheets/course.css"]
nav = [
  "index.md",
  { "Курс" = [
    "course/index.md",
    { "Week 1 — Mental model" = "course/week-1.md" },
    { "Week 2 — Workflow и handoff" = "course/week-2.md" },
    { "Week 3 — Context engineering" = "course/week-3.md" },
    { "Week 4 — ModelClient" = "course/week-4.md" },
    { "Week 5 — Runtime и policy" = "course/week-5.md" },
    { "Week 6 — Tools и permissions" = "course/week-6.md" },
    { "Week 7 — Evaluation и trace" = "course/week-7.md" },
    { "Week 8 — Business Automation & Solution Design" = "course/week-8.md" },
    { "Week 9 — Productionize the Capstone" = "course/week-9.md" },
    "course/capstone-evolution.md",
  ] },
  "autonomous-agents.md",
  "lab-repository.md",
  "repo-triage.md",
  "rag-lab.md",
  "integration-lab.md",
  "local-models.md",
  "ollama-vscode.md",
  "sources.md",
]

[project.markdown_extensions]
attr_list = {}
admonition = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid" },
]

[project.theme]
[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Включить тёмную тему"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Включить светлую тему"