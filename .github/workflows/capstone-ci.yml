name: Capstone Production Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'labs/integration-lab/**'
      - '.github/workflows/capstone-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'labs/integration-lab/**'
      - '.github/workflows/capstone-ci.yml'
  workflow_dispatch:

concurrency:
  group: capstone-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_course
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./labs/integration-lab
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: ./labs/integration-lab
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/agent_course
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Type check (pyright)
        working-directory: ./labs/integration-lab
        run: |
          python -m pyright src/integration_lab || true

      - name: Lint (ruff)
        working-directory: ./labs/integration-lab
        run: |
          python -m ruff check src/integration_lab

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ./labs/integration-lab
        run: |
          docker build -t agent-course-capstone:test .

      - name: Test Docker image runs
        working-directory: ./labs/integration-lab
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@host.docker.internal:5432/agent_course \
            -e GITHUB_TOKEN=test \
            --add-host=host.docker.internal:host-gateway \
            agent-course-capstone:test \
            python -c "from integration_lab.service import app; print('Import OK')"

  zensical-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Zensical
        run: python -m pip install "zensical==0.0.67"

      - name: Build Zensical site
        run: python -m zensical build --strict