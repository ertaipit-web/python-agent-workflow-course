name: Quality checks and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_course
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Pages metadata
        id: pages
        uses: actions/configure-pages@v5

      - name: Set the Pages base URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          config = Path("zensical.toml")
          content = config.read_text(encoding="utf-8")
          section = "[project]\n"
          if section not in content:
              raise SystemExit("zensical.toml is missing the [project] section")
          if "site_url =" in content:
              raise SystemExit("Set site_url only through this Pages workflow")

          base_url = os.environ["PAGES_BASE_URL"].rstrip("/") + "/"
          config.write_text(
              content.replace(section, f'{section}site_url = "{base_url}"\n', 1),
              encoding="utf-8",
          )
          PY

      - name: Install all Labs and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e "./labs/starter-repo[dev]" \
            -e "./labs/repo-triage[dev]" \
            -e "./labs/rag-lab[dev]" \
            -e "./labs/integration-lab[dev]" \
            "zensical==0.0.67"

      - name: Run all tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/agent_course
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest -q

      - name: Ruff
        run: python -m ruff check .

      - name: Pyright
        run: python -m pyright

      - name: Build Zensical site
        run: python -m zensical build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test Docker Compose
        working-directory: ./labs/integration-lab
        env:
          GITHUB_TOKEN: ""
        run: |
          trap 'docker compose down --volumes' EXIT
          docker build -t agent-course-capstone:test .
          docker compose up -d --build --wait
          docker compose ps
          curl --retry 30 --retry-delay 1 --retry-connrefused \
            --fail --silent --show-error http://localhost:8000/health

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
