name: Build and deploy course site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Pages metadata
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Zensical
        run: python -m pip install "zensical==0.0.67"

      - name: Set the Pages base URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          config = Path("zensical.toml")
          content = config.read_text(encoding="utf-8")
          section = "[project]\n"
          if section not in content:
              raise SystemExit("zensical.toml is missing the [project] section")
          if "site_url =" in content:
              raise SystemExit("Set site_url only through this Pages workflow")

          base_url = os.environ["PAGES_BASE_URL"].rstrip("/") + "/"
          config.write_text(
              content.replace(section, f'{section}site_url = "{base_url}"\n', 1),
              encoding="utf-8",
          )
          PY

      - name: Install starter-repository test dependencies
        run: python -m pip install -e "./labs/starter-repo[dev]"

      - name: Test starter repository
        run: python -m pytest "./labs/starter-repo/tests"

      - name: Build Zensical site
        run: python -m zensical build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
